[package]
name = "macro_engine"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.45", features = ["clock"] }
env_logger = "0.11.10"
log = "0.4.32"
mlua = { version = "0.11.6", features = ["lua54", "vendored"] }
parking_lot = "0.12.5"
png = "0.17"
rand = "0.8"
serde_json = "1"
ureq = { version = "2", features = ["json"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Threading", "Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Foundation"] }
